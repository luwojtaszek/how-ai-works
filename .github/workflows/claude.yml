# Mention @claude in an issue or pull request comment (only people with write access can trigger it),
# e.g. on an error report: "@claude verify this and open a PR with the fix".
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Edit,Write,WebFetch,WebSearch,Bash(bun install:*),Bash(bun run build:*),Bash(python3 scripts/qa/links.py:*),Bash(grep:*),Bash(git:*)"
